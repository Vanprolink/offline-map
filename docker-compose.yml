version: '4'
services:
  map-viewer:
    image: vanprolink0605/map-viewer:latest
    ports:
      - "0.0.0.0:443:443"
      - "0.0.0.0:3000:80"
    restart: always
    container_name: map-viewer
    env_file:
      - .env
    environment:
      - HTTPS=${HTTPS}
      - SSL_KEY_FILE=${SSL_KEY_FILE}
      - SSL_CERT_FILE=${SSL_CERT_FILE}
    volumes:
      - ./certs:/certs
